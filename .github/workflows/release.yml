name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" || true
          sdkmanager "platforms;android-37.0" || true
          sdkmanager "build-tools;37.0.0"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ] && [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare release asset
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "feature-manager-${GITHUB_REF_NAME}.apk"
          ls -lh "feature-manager-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: feature-manager-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
